apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
    spec:
      containers:
        - name: backend
          image: azizj11/azizjdidi-4ssa16-appgestiondesprojets:latest
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://devops-mysql:3306/test_db?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: devops-backend
spec:
  type: NodePort
  selector:
    app: devops-backend
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
